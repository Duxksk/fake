<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <video id="vid" autoplay playsinline>
    <source src="https://pixeldrain.com/api/file/EmWcL5R6" type="video/mp4">
    영상 재생을 지원하지 않는 브라우저입니다.
  </video>

  <script>
    const vid = document.getElementById('vid');

    window.addEventListener('load', () => {
      // 자동 전체화면 시도
      if (vid.requestFullscreen) vid.requestFullscreen();
      else if (vid.webkitRequestFullscreen) vid.webkitRequestFullscreen();
      else if (vid.msRequestFullscreen) vid.msRequestFullscreen();

      // 소리 나는 자동 재생 시도
      const playPromise = vid.play();
      if (playPromise !== undefined) {
        playPromise.catch(() => {
          // 브라우저에서 자동재생 제한 시
          alert("자동 재생이 브라우저 정책상 제한됩니다. 화면을 클릭하면 재생됩니다.");
        });
      }
    });
  </script>
</body>
</html>
