<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <video id="vid" autoplay muted playsinline>
    <source src="https://pixeldrain.com/api/file/EmWcL5R6" type="video/mp4">
    영상 재생을 지원하지 않는 브라우저입니다.
  </video>

  <script>
    const vid = document.getElementById('vid');

    // 페이지 로드 시 자동 전체화면
    window.addEventListener('load', () => {
      if (vid.requestFullscreen) {
        vid.requestFullscreen();
      } else if (vid.webkitRequestFullscreen) { /* Safari */
        vid.webkitRequestFullscreen();
      } else if (vid.msRequestFullscreen) { /* IE11 */
        vid.msRequestFullscreen();
      }
      vid.play();
    });
  </script>
</body>
</html>
